<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบปลายภาค ป.3 — สนุกกับวิทย์</title>
<style>
  :root{
    --cream:#FBF7EF;
    --card:#FFFFFF;
    --moss:#5C7A5C;
    --moss-dark:#3F5A3F;
    --clay:#D98E63;
    --clay-dark:#B96E45;
    --sky:#7FA8B8;
    --ink:#33362E;
    --ink-soft:#6B6E62;
    --line:#E7E0D2;
    --good:#4C8B5E;
    --good-bg:#E6F3E8;
    --bad:#C1543A;
    --bad-bg:#FBEAE4;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Sarabun','Noto Sans Thai','Segoe UI',sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #F1ECDD 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #EAF1E6 0%, transparent 40%),
      var(--cream);
    color:var(--ink);
    line-height:1.6;
    padding-bottom:80px;
  }
  header.hero{
    padding:48px 20px 36px;
    text-align:center;
    background:linear-gradient(180deg, #F1ECDD 0%, var(--cream) 100%);
    border-bottom:1px solid var(--line);
  }
  header.hero .tag{
    display:inline-block;
    background:var(--moss);
    color:#fff;
    padding:6px 16px;
    border-radius:999px;
    font-size:0.85rem;
    letter-spacing:0.02em;
    margin-bottom:14px;
  }
  header.hero h1{
    font-size:2.1rem;
    margin:0 0 8px;
    color:var(--moss-dark);
    font-weight:800;
  }
  header.hero p{
    margin:0;
    color:var(--ink-soft);
    font-size:1.05rem;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 18px;
  }
  .progress-bar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(251,247,239,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 18px;
  }
  .progress-inner{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .progress-track{
    flex:1;
    height:10px;
    background:#EDE7D8;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--moss), var(--sky));
    border-radius:999px;
    transition:width .25s ease;
  }
  .progress-text{
    font-size:0.85rem;
    color:var(--ink-soft);
    white-space:nowrap;
    min-width:70px;
    text-align:right;
  }
  .section-divider{
    margin:40px 0 18px;
    padding-top:8px;
  }
  .section-divider .num{
    color:var(--clay-dark);
    font-weight:700;
    font-size:0.95rem;
  }
  .section-divider h2{
    margin:2px 0 0;
    font-size:1.3rem;
    color:var(--moss-dark);
    border-bottom:2px solid var(--line);
    padding-bottom:10px;
  }
  .qcard{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(63,90,63,0.06);
    border:1px solid var(--line);
  }
  .qhead{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .qnum{
    flex:none;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--moss);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.85rem;
    font-weight:700;
  }
  .qtext{
    font-size:1.03rem;
    color:var(--ink);
    padding-top:2px;
  }
  .hint{
    display:block;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    background:#FEFDFB;
  }
  .opt:hover{ border-color:var(--sky); }
  .opt.selected{
    border-color:var(--moss);
    background:#EEF4EC;
  }
  .opt input{ accent-color:var(--moss); width:18px; height:18px; flex:none; }
  .opt span{ font-size:0.98rem; }
  select.dropdown{
    width:100%;
    padding:11px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#FEFDFB;
    font-family:inherit;
    font-size:0.98rem;
    color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6E62' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:16px;
  }
  select.dropdown:focus{ outline:2px solid var(--sky); border-color:var(--sky); }
  .feedback{
    margin-top:12px;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.92rem;
    display:none;
  }
  .qcard.correct{ border-color:var(--good); background:var(--good-bg); }
  .qcard.incorrect{ border-color:var(--bad); background:var(--bad-bg); }
  .qcard.correct .feedback, .qcard.incorrect .feedback{ display:block; }
  .qcard.correct .feedback{ color:var(--good); }
  .qcard.incorrect .feedback{ color:var(--bad); }
  .qcard.correct .opt.selected{ border-color:var(--good); background:#DEF0E1; }
  .qcard.incorrect .opt.selected{ border-color:var(--bad); background:#F8DED6; }
  .qcard.incorrect .opt.answer-correct{ border-color:var(--good); background:#DEF0E1; }

  .submit-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:rgba(251,247,239,0.95);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:14px 18px;
    display:flex;
    justify-content:center;
    z-index:60;
  }
  .submit-btn{
    background:var(--clay);
    color:#fff;
    border:none;
    padding:14px 40px;
    font-size:1.05rem;
    font-weight:700;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(185,110,69,0.35);
    transition:transform .12s, background .15s;
  }
  .submit-btn:hover{ background:var(--clay-dark); transform:translateY(-1px); }
  .submit-btn:active{ transform:translateY(0); }

  .result-panel{
    background:linear-gradient(135deg, var(--moss) 0%, var(--moss-dark) 100%);
    color:#fff;
    border-radius:var(--radius);
    padding:32px 26px;
    text-align:center;
    margin:24px 0 30px;
    display:none;
  }
  .result-panel .score{
    font-size:3rem;
    font-weight:800;
    margin:6px 0;
  }
  .result-panel p{ margin:4px 0; opacity:0.95; }
  .result-panel .msg{ font-size:1.1rem; margin-top:10px; }
  .jump-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-top:-10px;
  }
  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.85rem;
    margin-top:30px;
  }
  @media (max-width:480px){
    header.hero h1{ font-size:1.5rem; }
    .qcard{ padding:16px 16px; }
  }
</style>
</head>
<body>

<header class="hero">
  <span class="tag">เฉลยข้อสอบปลายภาค 1/2569</span>
  <h1>วิชาสนุกกับวิทย์ — ชั้นประถมศึกษาปีที่ 3</h1>
  <p>ปัจจัยในการดำรงชีวิตของมนุษย์และสัตว์ &nbsp;•&nbsp; วัสดุรอบตัวเรา</p>
</header>

<div class="progress-bar">
  <div class="progress-inner">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0 ข้อ</div>
  </div>
</div>

<div class="wrap">
  <div class="result-panel" id="resultPanel">
    <p>คะแนนของนักเรียน</p>
    <div class="score" id="scoreText">0 / 0</div>
    <p id="scorePercent"></p>
    <p class="msg" id="scoreMsg"></p>
  </div>
  <p class="jump-note" id="jumpNote"></p>
  <div id="quizRoot"></div>
</div>

<div class="submit-bar">
  <button class="submit-btn" id="submitBtn">ส่งคำตอบ / ตรวจคะแนน</button>
</div>

<footer>ทำครบทุกข้อแล้วกดปุ่ม "ส่งคำตอบ" ด้านล่างเพื่อดูคะแนนและเฉลย</footer>

    {prompt:"13. การใส่น้ำร้อนที่จัดลงในแก้ว อาจทำให้เกิดการเปลี่ยนแปลงอย่างไร", type:"mc",
      options:["แก้วร้าวและแตกได้","แก้วหดตัวเล็กกว่าเดิม","แก้วขยายตัวใหญ่กว่าเดิม","แก้วบิดเบี้ยวเสียรูป"], correct:0},
  ]
},
];

/* ============ RENDER ENGINE ============ */
const root = document.getElementById('quizRoot');
let flatQuestions = []; // {el, data, state}

sections.forEach((sec, sIdx)=>{
  const divider = document.createElement('div');
  divider.className = 'section-divider';
  divider.innerHTML = `<div class="num">ส่วนที่ ${sIdx+1}</div><h2>${sec.title}</h2>`;
  if(sec.intro){
    const p = document.createElement('p');
    p.className = 'hint';
    p.style.marginBottom = '10px';
    p.textContent = sec.intro;
    divider.appendChild(p);
  }
  root.appendChild(divider);

  sec.questions.forEach((q)=>{
    const qIndex = flatQuestions.length + 1;
    const card = document.createElement('div');
    card.className = 'qcard';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<div class="qnum">${qIndex}</div><div class="qtext">${q.prompt}${q.type==='multi' ? '<span class="hint">(เลือกได้มากกว่า 1 ข้อ)</span>' : ''}</div>`;
    card.appendChild(head);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';

    const state = { selected: q.type === 'multi' ? [] : null };

    q.options.forEach((optText, oIdx)=>{
      const opt = document.createElement('label');
      opt.className = 'opt';
      const input = document.createElement('input');
      input.type = q.type === 'multi' ? 'checkbox' : 'radio';
      input.name = 'q' + qIndex;
      input.value = oIdx;
      input.addEventListener('change', ()=>{
        if(q.type === 'multi'){
          if(input.checked){ state.selected.push(oIdx); opt.classList.add('selected'); }
          else { state.selected = state.selected.filter(v=>v!==oIdx); opt.classList.remove('selected'); }
        } else {
          state.selected = oIdx;
          [...optsWrap.children].forEach(c=>c.classList.remove('selected'));
          opt.classList.add('selected');
        }
        updateProgress();
      });
      const span = document.createElement('span');
      span.textContent = optText;
      opt.appendChild(input);
      opt.appendChild(span);
      optsWrap.appendChild(opt);
    });

    card.appendChild(optsWrap);

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    card.appendChild(feedback);

    root.appendChild(card);
    flatQuestions.push({ el: card, optsEl: optsWrap, feedbackEl: feedback, data: q, state });
  });
});

/* ============ PROGRESS ============ */
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const total = flatQuestions.length;

function isAnswered(fq){
  if(fq.data.type === 'multi') return fq.state.selected.length > 0;
  return fq.state.selected !== null;
}

function updateProgress(){
  const answered = flatQuestions.filter(isAnswered).length;
  progressFill.style.width = (answered/total*100) + '%';
  progressText.textContent = answered + ' / ' + total + ' ข้อ';
}
updateProgress();

/* ============ SCORING ============ */
document.getElementById('submitBtn').addEventListener('click', ()=>{
  const unanswered = flatQuestions.filter(fq=>!isAnswered(fq));
  if(unanswered.length > 0){
    const ok = confirm('นักเรียนยังตอบไม่ครบ ' + unanswered.length + ' ข้อ ต้องการส่งคำตอบเลยหรือไม่?');
    if(!ok){
      unanswered[0].el.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
  }

  let score = 0;
  flatQuestions.forEach(fq=>{
    const q = fq.data;
    let isCorrect = false;
    if(q.type === 'multi'){
      const sel = [...fq.state.selected].sort().join(',');
      const cor = [...q.correct].sort().join(',');
      isCorrect = sel === cor && fq.state.selected.length > 0;
    } else {
      isCorrect = fq.state.selected === q.correct;
    }
    if(isCorrect) score++;

    fq.el.classList.add(isCorrect ? 'correct' : 'incorrect');
    const optNodes = [...fq.optsEl.children];
    optNodes.forEach((node, idx)=>{
      const isSelected = q.type==='multi' ? fq.state.selected.includes(idx) : fq.state.selected===idx;
      const isRightAns = q.type==='multi' ? q.correct.includes(idx) : q.correct===idx;
      if(isSelected) node.classList.add('selected');
      if(!isCorrect && isRightAns) node.classList.add('answer-correct');
      const inp = node.querySelector('input');
      if(inp) inp.disabled = true;
    });

    if(isCorrect){
      fq.feedbackEl.textContent = '✓ ถูกต้อง!';
    } else {
      let ansText;
      if(q.type === 'multi'){
        ansText = q.correct.map(i=>q.options[i]).join(', ');
      } else {
        ansText = q.options[q.correct];
      }
      fq.feedbackEl.textContent = '✗ ยังไม่ถูก — คำตอบที่ถูกต้องคือ: ' + ansText;
    }
  });

  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  const pct = Math.round(score/total*100);
  document.getElementById('scoreText').textContent = score + ' / ' + total;
  document.getElementById('scorePercent').textContent = 'คิดเป็น ' + pct + '%';
  let msg;
  if(pct >= 90) msg = 'ยอดเยี่ยมมาก! เก่งวิทยาศาสตร์สุดๆ 🌟';
  else if(pct >= 75) msg = 'ทำได้ดีมาก! เกือบเต็มแล้ว 👏';
  else if(pct >= 60) msg = 'ทำได้ดี ลองทบทวนข้อที่ผิดอีกนิดนะ 💪';
  else msg = 'ลองทบทวนเนื้อหาอีกครั้งแล้วมาทำใหม่นะ สู้ๆ 🌱';
  document.getElementById('scoreMsg').textContent = msg;
  panel.scrollIntoView({behavior:'smooth', block:'start'});

  document.getElementById('submitBtn').textContent = 'ตรวจแล้ว — เลื่อนดูคะแนนด้านบน';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').style.opacity = '0.6';
  document.getElementById('submitBtn').style.cursor = 'default';
});
</script>
</body>
